<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rates</title>
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1C2E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rates">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#EDF0F4; --card:#FFFFFF; --card2:#F7F9FB;
  --ink:#16283F; --ink2:#4A5B72; --muted:#7C8B9E; --faint:#A6B2C1;
  --line:#E9EDF2; --line2:#DDE3EB;
  --blue:#2C6FB5; --orange:#D2761C; --green:#1D7A4A; --red:#C22B2B;
  --s1:#16283F; --s2:#2C6FB5; --s3:#D2761C;
  --sel:#EAF1F9;
  --shadow:0 1px 2px rgba(22,40,63,.04),0 6px 18px rgba(22,40,63,.05);
  --sans:'Inter','Helvetica Neue',Helvetica,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --canvas:#0F1C2E; --card:#16263B; --card2:#1B2E46;
    --ink:#E8EEF6; --ink2:#B4C1D2; --muted:#8797AC; --faint:#5C6D84;
    --line:#22364F; --line2:#2A4160;
    --blue:#6FA6E0; --orange:#E89A4C; --green:#4CBF83; --red:#EF6B6B;
    --s1:#E8EEF6; --s2:#6FA6E0; --s3:#E89A4C; --sel:#1E3552;
    --shadow:0 1px 2px rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.18);
  }
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;
  font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

.wrap{max-width:1180px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 2px 10px}
.top h1{margin:0;font-size:26px;line-height:1.05;font-weight:700;letter-spacing:-.02em}
.top .org{font-size:12px;color:var(--muted);margin-top:2px}
.upd{display:flex;align-items:center;gap:8px;min-width:0}
.status{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);min-width:0;text-align:right}
.status span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.status.busy .dot{background:var(--faint)}
.status.warn .dot{background:var(--orange)}
.status.err .dot{background:var(--red)}
.refresh{flex:none;display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line2);background:var(--card);
  border-radius:50%;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);padding:0;position:relative}
.refresh::after{content:"";position:absolute;inset:-4px}
.refresh svg{width:17px;height:17px}
.refresh.busy svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.grid{display:grid;gap:8px;grid-template-columns:1fr;align-items:start}
@media (min-width:900px){.grid{grid-template-columns:1fr 1fr 1fr;gap:14px}}

.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;padding:9px 14px 2px}
.card-h h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.card-h .ccy{font-size:11px;font-weight:600;color:var(--ink2);background:var(--card2);border:1px solid var(--line);
  border-radius:5px;padding:1px 6px}
.card-h .asof{margin-left:auto;font-size:12px;color:var(--muted)}
.notice{margin:2px 14px 4px;font-size:12px;color:var(--orange);background:color-mix(in srgb,var(--orange) 10%,transparent);
  border-radius:7px;padding:5px 9px}

.rows{list-style:none;margin:0;padding:0 6px 5px}
.row{display:grid;grid-template-columns:1fr auto 6.4em 12px;column-gap:10px;align-items:center;width:100%;text-align:left;
  background:none;border:0;border-radius:9px;padding:8px 8px;cursor:pointer;border-top:1px solid var(--line);min-height:44px}
.rows li:first-child .row{border-top-color:transparent}
.row:active{background:var(--card2)}
.row[aria-expanded="true"]{background:var(--sel);border-top-color:transparent;border-radius:9px 9px 0 0}
.rows li:has(.row[aria-expanded="true"]) + li .row{border-top-color:transparent}
.lbl{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.1;text-align:right}
.num small{font-size:13px;font-weight:500;color:var(--ink2);margin-left:1px}
.chg{font-size:12px;font-weight:600;white-space:nowrap;text-align:right}
.up{color:var(--green)}.dn{color:var(--red)}.flat{color:var(--muted)}
.rsrc{grid-column:1 / 4;font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{display:flex;justify-content:space-between;gap:10px;padding:6px 14px 10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.foot a{color:var(--blue);text-decoration:none;font-weight:500;white-space:nowrap}
.foot a:active{opacity:.6}
.chev{width:12px;height:12px;color:var(--faint);transition:transform .18s}
.row[aria-expanded="true"] .chev{transform:rotate(180deg);color:var(--ink2)}

.panel{background:var(--sel);border-radius:0 0 9px 9px;padding:0 4px 6px;margin-bottom:2px}
.chart-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 6px 0}
.chart-t{font-size:12px;color:var(--ink2);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px;flex:none}
.seg button{border:0;background:none;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;min-width:34px}
@media (pointer:coarse){.seg button{min-height:30px;min-width:38px}}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(22,40,63,.12)}
.chart{position:relative;height:150px;margin:4px 2px 0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:visible}
.chart .ax{font-size:10.5px;fill:var(--muted)}
.chart .gl{stroke:var(--line2);stroke-width:1}
.tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--card);border-radius:8px;padding:5px 8px;
  font-size:12px;line-height:1.4;white-space:nowrap;box-shadow:var(--shadow);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip b{font-weight:600}
.empty{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--muted);text-align:center;padding:0 24px}
/* Phones: stretch the three cards to fill the screen when every chart is closed.
   An open chart still takes its natural height and the page scrolls as needed. */
@media (max-width:600px){
  .wrap{display:flex;flex-direction:column;min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  .wrap{padding-bottom:10px}
  .grid{flex:1;display:flex;flex-direction:column;align-items:stretch}
  .card,.rows,.rows li{flex:1;display:flex;flex-direction:column}
  .row{flex:1;align-content:center;padding:6px 8px;grid-template-columns:1fr auto 5.6em 12px;column-gap:8px}
  .num{font-size:24px}
  .num small{font-size:14px}
  .foot{padding:5px 14px 8px}
  .card-h h2{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Rates</h1>
      <div class="org">Emastra</div>
    </div>
    <div class="upd">
      <div class="status" id="status" role="status"><span class="dot"></span><span id="statusText">Loading</span></div>
      <button class="refresh" id="refresh" type="button" aria-label="Refresh rates">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
  </header>

  <main class="grid">
    <section class="card" id="sofr"></section>
    <section class="card" id="sonia"></section>
    <section class="card" id="fx"></section>
  </main>
</div>

<script>
(() => {
  const API = "/api/rates";
  const CACHE_KEY = "emastra-rates-v1";
  const RANGES = [["1M", 1], ["3M", 3], ["6M", 6], ["1Y", 12]];

  const SECTIONS = {
    sofr: {
      title: "SOFR", ccy: "USD", sub: "Secured Overnight Financing Rate, New York Fed",
      kind: "rate", sources: ["NY Fed (SOFR)"],
      when: "Updates about 8:00 AM ET", site: "newyorkfed.org",
      url: "https://www.newyorkfed.org/markets/reference-rates/sofr-averages-and-index",
      series: [
        { key: "sofr_30", label: "30-Day", color: "--s2", dp: 4, src: "New York Fed SOFR 30-Day Average" },
        { key: "sofr_90", label: "90-Day", color: "--s3", dp: 4, src: "New York Fed SOFR 90-Day Average" },
      ],
    },
    sonia: {
      title: "SONIA", ccy: "GBP", sub: "Sterling Overnight Index Average, Bank of England",
      kind: "rate", sources: ["Bank of England (SONIA)"],
      when: "Updates about 9:00 AM London", site: "bankofengland.co.uk",
      url: "https://www.bankofengland.co.uk/markets/sonia-benchmark",
      series: [
        { key: "sonia_30", label: "30-Day", color: "--s2", dp: 4, src: "Calculated from Bank of England SONIA Index" },
        { key: "sonia_90", label: "90-Day", color: "--s3", dp: 4, src: "Calculated from Bank of England SONIA Index" },
      ],
    },
    fx: {
      title: "Exchange Rates", ccy: "ECB", sub: "ECB Reference Rates, Indicative Mid",
      kind: "fx", sources: ["ECB (FX)"],
      when: "Updates about 4:00 PM Frankfurt", site: "ecb.europa.eu",
      url: "https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html",
      series: [
        { key: "usd_gbp", label: "1 USD in Pounds", sym: "£", color: "--s2", dp: 4, src: "ECB Reference Rates via Frankfurter" },
        { key: "usd_jpy", label: "1 USD in Yen", sym: "¥", color: "--s3", dp: 2, src: "ECB Reference Rates via Frankfurter" },
      ],
    },
  };

  // open: the one series whose chart is showing, or null when every chart is collapsed
  const state = { data: null, range: "3M", open: null };
  const $ = (s, r = document) => r.querySelector(s);
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const fmtDate = (d, withYear) => { const [y, m, dd] = d.split("-"); return `${+dd} ${MON[+m - 1]}${withYear ? " " + y : ""}`; };
  const fmtNum = (v, dp) => v.toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
  const fmtVal = (sec, s, v) => sec.kind === "rate" ? fmtNum(v, s.dp) + "%" : (s.sym || "") + fmtNum(v, s.dp);

  function lastTwo(pts) {
    if (!pts || !pts.length) return null;
    const [d, v] = pts[pts.length - 1];
    const prev = pts.length > 1 ? pts[pts.length - 2] : null;
    return { d, v, pd: prev && prev[0], pv: prev && prev[1] };
  }

  // Rates move in basis points, FX in percent
  function changeHTML(sec, s, from, to, title) {
    const diff = to - from;
    if (sec.kind === "rate") {
      const r = Math.round(diff * 100 * 100) / 100;
      if (r === 0) return `<span class="chg flat" title="${title}">Unchanged</span>`;
      return `<span class="chg ${r > 0 ? "up" : "dn"}" title="${title}">${r > 0 ? "▲" : "▼"} ${fmtNum(Math.abs(r), Math.abs(r) < 1 ? 2 : 1)} bp</span>`;
    }
    if (Math.abs(diff) < Math.pow(10, -s.dp) / 2) return `<span class="chg flat" title="${title}">Unchanged</span>`;
    const pct = diff / from * 100;
    return `<span class="chg ${diff > 0 ? "up" : "dn"}" title="${title}: ${fmtNum(Math.abs(diff), s.dp)}">${diff > 0 ? "▲" : "▼"} ${fmtNum(Math.abs(pct), 2)}%</span>`;
  }

  const CHEV = `<svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>`;

  function renderSection(id) {
    const sec = SECTIONS[id], el = document.getElementById(id);
    const m = (state.data && state.data.metrics) || {};
    const errs = ((state.data && state.data.errors) || []).filter((e) => sec.sources.includes(e.source));
    const latest = sec.series.map((s) => lastTwo(m[s.key])).filter(Boolean).reduce((a, lt) => (lt.d > a ? lt.d : a), "");
    const rows = sec.series.map((s) => {
      const lt = lastTwo(m[s.key]);
      const open = state.open === s.key;
      const value = !lt ? "–" : sec.kind === "rate" ? `${fmtNum(lt.v, s.dp)}<small>%</small>` : `<small>${s.sym}</small>${fmtNum(lt.v, s.dp)}`;
      const chg = !lt ? `<span class="chg flat">–</span>`
        : lt.pv == null ? `<span class="chg flat">No prior</span>`
        : changeHTML(sec, s, lt.pv, lt.v, `Change from ${fmtDate(lt.pd, true)}`);
      const stale = lt && latest && lt.d !== latest ? ` <span class="flat" style="font-weight:400;font-size:12px">${fmtDate(lt.d, false)}</span>` : "";
      return `<li><button class="row" type="button" data-key="${s.key}" aria-expanded="${open}" aria-controls="p-${s.key}">
        <span class="lbl">${esc(s.label)}${stale}</span><span class="num">${value}</span>${chg}${CHEV}<span class="rsrc">${esc(s.src)}</span></button>
        ${open ? `<div class="panel" id="p-${s.key}"><div class="chart-h"><span class="chart-t" id="ct-${s.key}"></span>
          <div class="seg" role="group" aria-label="Chart range">${RANGES.map(([r]) => `<button type="button" data-range="${r}" aria-pressed="${state.range === r}">${r}</button>`).join("")}</div></div>
          <div class="chart" data-chart="${s.key}"></div></div>` : ""}</li>`;
    }).join("");
    el.innerHTML = `
      <div class="card-h" title="${esc(sec.sub)}"><h2>${sec.title}</h2><span class="ccy">${sec.ccy}</span>
        <span class="asof">${latest ? "As of " + fmtDate(latest, false) : "Not available"}</span></div>
      ${errs.length ? `<div class="notice">${errs.map((e) => esc(e.source.replace(/ \(.*/, "")) + " did not respond." + (state.data.fromCache ? "" : " Showing saved values.")).join(" ")}</div>` : ""}
      <ul class="rows">${rows}</ul>
      <div class="foot"><span>${esc(sec.when)}</span><a href="${sec.url}" target="_blank" rel="noopener">${esc(sec.site)} ↗</a></div>`;
    el.querySelectorAll(".row").forEach((b) => b.addEventListener("click", () => {
      state.open = state.open === b.dataset.key ? null : b.dataset.key;
      renderAll();
      const panel = state.open && document.getElementById("p-" + state.open);
      if (panel) panel.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }));
    el.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => { state.range = b.dataset.range; renderAll(); }));
    const box = el.querySelector(".chart");
    if (box) { drawChart(id, box.dataset.chart); ro.observe(box); }
  }

  // ---------- chart ----------
  function niceTicks(min, max, n) {
    const span = max - min || Math.abs(max) || 1;
    const raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map((x) => x * mag).find((x) => span / x <= n) || 10 * mag;
    return { step };
  }

  function drawChart(id, key) {
    const sec = SECTIONS[id];
    const box = document.querySelector(`[data-chart="${key}"]`);
    if (!box) return;
    const s = sec.series.find((q) => q.key === key);
    const pts = ((state.data && state.data.metrics) || {})[key] || [];
    const months = RANGES.find(([r]) => r === state.range)[1];
    const title = $(`#ct-${key}`);
    if (!pts.length) { box.innerHTML = `<div class="empty">No history available yet. Tap Refresh to try again.</div>`; title.textContent = ""; return; }

    const end = pts[pts.length - 1][0];
    const ed = new Date(end + "T00:00:00Z"); ed.setUTCMonth(ed.getUTCMonth() - months);
    const start = ed.toISOString().slice(0, 10);
    const vis = pts.filter(([d]) => d >= start);
    if (!vis.length) { box.innerHTML = `<div class="empty">No data in this range.</div>`; title.textContent = ""; return; }
    title.innerHTML = vis.length > 1 ? `${state.range} Change ${changeHTML(sec, s, vis[0][1], vis[vis.length - 1][1], `Change from ${fmtDate(vis[0][0], true)}`)}` : "";

    const W = Math.max(box.clientWidth, 240), H = box.clientHeight;
    const P = { l: 6, r: 46, t: 10, b: 22 };
    const t0 = Date.parse(start), t1 = Date.parse(end);
    const all = vis.map(([, v]) => v);
    let lo = Math.min(...all), hi = Math.max(...all);
    const padv = (hi - lo) * 0.12 || Math.abs(hi) * 0.01 || 0.01; lo -= padv; hi += padv;
    // Snap the axis out to whole steps so the top and bottom labels always enclose the data
    const { step } = niceTicks(lo, hi, 4);
    lo = Math.floor(lo / step + 1e-9) * step; hi = Math.ceil(hi / step - 1e-9) * step;
    const ticks = [];
    for (let i = 0; lo + i * step <= hi + step * 1e-9; i++) ticks.push(+(lo + i * step).toFixed(10));
    const x = (d) => P.l + (Date.parse(d) - t0) / Math.max(t1 - t0, 1) * (W - P.l - P.r);
    const y = (v) => P.t + (hi - v) / (hi - lo) * (H - P.t - P.b);
    const ydp = Math.max(0, Math.min(4, -Math.floor(Math.log10(step)) + (step / Math.pow(10, Math.floor(Math.log10(step))) === 2.5 ? 1 : 0)));

    const grid = ticks.map((v) => `<line class="gl" x1="${P.l}" x2="${W - P.r + 4}" y1="${y(v)}" y2="${y(v)}"/>
      <text class="ax" x="${W - P.r + 8}" y="${y(v) + 3.5}">${fmtNum(v, ydp)}${sec.kind === "rate" ? "%" : ""}</text>`).join("");

    const nx = W < 420 ? 3 : 4, xt = [];
    for (let i = 0; i <= nx; i++) {
      const t = new Date(t0 + (t1 - t0) * i / nx);
      const lbl = months >= 6 ? `${MON[t.getUTCMonth()]} '${String(t.getUTCFullYear()).slice(2)}` : `${t.getUTCDate()} ${MON[t.getUTCMonth()]}`;
      const px = P.l + (W - P.l - P.r) * i / nx;
      xt.push(`<text class="ax" x="${px}" y="${H - 5}" text-anchor="${i === 0 ? "start" : i === nx ? "end" : "middle"}">${lbl}</text>`);
    }

    const path = vis.map(([d, v], i) => `${i ? "L" : "M"}${x(d).toFixed(1)},${y(v).toFixed(1)}`).join("");
    const color = css(s.color);
    const area = vis.length > 1 ? `${path}L${x(vis[vis.length - 1][0]).toFixed(1)},${H - P.b}L${x(vis[0][0]).toFixed(1)},${H - P.b}Z` : "";
    const gid = `g-${key}`;

    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sec.title + " " + s.label)} History Chart">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".18"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      ${grid}${xt.join("")}
      ${area ? `<path d="${area}" fill="url(#${gid})"/>` : ""}
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
      <g class="hover" style="display:none"><line y1="${P.t}" y2="${H - P.b}" stroke="${css("--faint")}" stroke-dasharray="3 3"/><circle r="3.5" fill="${css("--card")}" stroke="${color}" stroke-width="2"/></g>
      <rect x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent"/>
    </svg><div class="tip"></div>`;

    const svg = box.querySelector("svg"), hov = svg.querySelector(".hover"), tip = box.querySelector(".tip");
    const line = hov.querySelector("line"), dot = hov.querySelector("circle");

    function show(ev) {
      const rect = svg.getBoundingClientRect();
      const px = (ev.clientX - rect.left) * (W / rect.width);
      const t = t0 + (px - P.l) / (W - P.l - P.r) * (t1 - t0);
      let best = vis[0];
      for (const p of vis) if (Math.abs(Date.parse(p[0]) - t) < Math.abs(Date.parse(best[0]) - t)) best = p;
      const cx = x(best[0]);
      hov.style.display = ""; line.setAttribute("x1", cx); line.setAttribute("x2", cx);
      dot.setAttribute("cx", cx); dot.setAttribute("cy", y(best[1]));
      tip.innerHTML = `<span style="opacity:.7">${fmtDate(best[0], true)}</span> <b>${fmtVal(sec, s, best[1])}</b>`;
      tip.classList.add("on");
      const bw = box.clientWidth, tw = tip.offsetWidth, sx = cx * (rect.width / W);
      tip.style.left = Math.min(Math.max(sx - tw / 2, 0), bw - tw) + "px";
    }
    const hide = () => { hov.style.display = "none"; tip.classList.remove("on"); };
    svg.addEventListener("pointermove", show);
    svg.addEventListener("pointerdown", show);
    svg.addEventListener("pointerleave", hide);
    svg.addEventListener("pointercancel", hide);
  }

  // ---------- data ----------
  function setStatus(kind, text) {
    const s = $("#status"); s.className = "status " + kind; $("#statusText").textContent = text;
  }
  // Time only for today, date only for earlier days, to keep the header status short
  const timeStr = (iso) => {
    const d = new Date(iso);
    return d.toDateString() === new Date().toDateString()
      ? d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })
      : d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  };

  function loadCache() { try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch { return null; } }
  function saveCache(d) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch {} }

  // Direct fallback if the site's /api/rates function is unreachable (e.g. file opened locally).
  // NY Fed and Frankfurter allow browser requests; the Bank of England does not.
  async function direct() {
    const j = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); };
    const from = new Date(Date.now() - 400 * 864e5).toISOString().slice(0, 10);
    const metrics = {}, errors = [];
    try {
      const a = await j("https://markets.newyorkfed.org/api/rates/secured/sofrai/last/280.json");
      const asc = a.refRates.slice().sort((p, q) => (p.effectiveDate < q.effectiveDate ? -1 : 1));
      metrics.sofr_30 = asc.map((r) => [r.effectiveDate, r.average30day]);
      metrics.sofr_90 = asc.map((r) => [r.effectiveDate, r.average90day]);
    } catch { errors.push({ source: "NY Fed (SOFR)" }); }
    try {
      const f = await j(`https://api.frankfurter.dev/v1/${from}..?from=USD&to=GBP,JPY`);
      const ds = Object.keys(f.rates).sort();
      metrics.usd_gbp = ds.map((d) => [d, f.rates[d].GBP]);
      metrics.usd_jpy = ds.map((d) => [d, f.rates[d].JPY]);
    } catch { errors.push({ source: "ECB (FX)" }); }
    errors.push({ source: "Bank of England (SONIA)" });
    return { generatedAt: new Date().toISOString(), metrics, errors, partial: true };
  }

  async function refresh(force) {
    const btn = $("#refresh"); btn.classList.add("busy"); btn.disabled = true;
    setStatus("busy", "Updating");
    const cached = loadCache();
    let fresh = null;
    try {
      const r = await fetch(API + (force ? "?t=" + Date.now() : ""), { cache: "no-store" });
      if (!r.ok || !(r.headers.get("content-type") || "").includes("json")) throw new Error(r.status);
      fresh = await r.json();
    } catch {
      try { fresh = await direct(); } catch { fresh = null; }
    }
    if (fresh) {
      // keep previously saved series for any source that failed this time
      if (cached && cached.metrics) for (const k of Object.keys(cached.metrics)) if (!fresh.metrics[k] || !fresh.metrics[k].length) fresh.metrics[k] = cached.metrics[k];
      state.data = fresh; saveCache({ ...fresh, errors: [] });
      setStatus(fresh.errors.length ? "warn" : "", `Updated ${timeStr(fresh.generatedAt)}`);
    } else if (cached) {
      state.data = { ...cached, fromCache: true };
      setStatus("err", `Offline, saved ${timeStr(cached.generatedAt)}`);
    } else {
      setStatus("err", "No connection");
    }
    renderAll();
    btn.classList.remove("busy"); btn.disabled = false;
  }

  // Charts fill the panel width, so redraw whenever an open chart changes size
  const chartSize = {};
  const ro = new ResizeObserver((entries) => entries.forEach((e) => {
    const key = e.target.dataset.chart, k = e.target.clientWidth + "x" + e.target.clientHeight;
    if (chartSize[key] !== k) { chartSize[key] = k; drawChart(e.target.closest(".card").id, key); }
  }));

  function renderAll() { ro.disconnect(); Object.keys(SECTIONS).forEach(renderSection); }

  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", renderAll);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && state.data && Date.now() - Date.parse(state.data.generatedAt) > 30 * 60e3) refresh(false);
  });
  $("#refresh").addEventListener("click", () => refresh(true));

  const c = loadCache();
  if (c) { state.data = { ...c }; renderAll(); setStatus("", `Saved ${timeStr(c.generatedAt)}`); } else renderAll();
  refresh(false);
})();
</script>
</body>
</html>
